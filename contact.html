<body>
  <!-- EDITING GUIDE
       CONTACT: edit introductory copy, email, telephone and form labels/options below. This form still uses mailto and depends on the visitor's email app; it is not a server-backed submission form. To use a real form service, change action/method to your handler and follow its field-name requirements. Keep each label for matched to its input id. Update visible contact text and href values together.
       Shared appearance: styles.css. Shared interactions and image lists: script.js.
  -->

  <!-- ===== PAGE HEADER ===== -->
  <!-- SHARED HEADER: edit navigation text and href destinations here.
       Navigation is repeated across all seven HTML pages: apply shared changes to each. -->
  <header class="page-head">
    <div class="wrap bar">
      <a class="logo" href="index.html"><img src="images/home/logo.png" alt="Commonground"></a>
      <button class="menu-btn" aria-label="Menu"><span></span></button>
      <nav class="nav">
        <a href="video.html">Video</a>
        <a href="photography.html">Photography</a>
        <a href="brand.html">Brand</a>
        <a href="clients.html">Clients</a>
        <a href="about.html">About</a>
        <a class="pill" href="contact.html">Get in Touch</a>
      </nav>
    </div>
  </header>

  <section class="page-hero" style="background-image:url('images/hero-comms.jpg')">
    <div class="wrap"><p class="mark" style="color:#cecaaf">/ Contact</p><h1>Start a conversation.</h1></div>
  </section>

  <!-- ===== ENQUIRY FORM — Room3 fields, no spec tickboxes ===== -->
  <section class="section">
    <div class="wrap split">
      <div class="prose">
        <p>Tell us about the organisation, the goal, and the people you need to reach.</p>
        <p>Call <a href="tel:+61390887586">(03) 9088 7586</a><br>Melbourne, and wherever the work needs to be.</p>
      </div>
      <!-- FORM: edit action, method and fields only with the chosen submission handler in mind. -->
      <form action="mailto:hello@commonground.cc" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input id="name" name="name" required>
        <label for="org">Organisation</label>
        <input id="org" name="organisation">
        <div class="form-row">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel">
          </div>
        </div>
        <label for="title">Project working title</label>
        <input id="title" name="project_title">
        <label for="message">Project description</label>
        <textarea id="message" name="description" required></textarea>
        <div class="form-row">
          <div>
            <label for="runtime">Runtime</label>
            <input id="runtime" name="runtime" placeholder="e.g. 3 minutes, or a stills series">
          </div>
          <div>
            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="date">
          </div>
        </div>
        <label for="budget">Indicative budget</label>
        <input id="budget" name="budget" placeholder="$">
        <label for="else">Anything else — or references to share?</label>
        <textarea id="else" name="notes"></textarea>
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </section>

  <!-- FOOTER: update business name, location and phone. Keep tel: href in international format.
       Repeat shared footer changes across the other HTML pages. -->
  <footer class="site-foot wrap">
    <span>Commonground Communication · Melbourne</span>
    <a href="tel:+61390887586">(03) 9088 7586</a>
  </footer>
  <!-- Load shared interactions last. Keep this script link and the styles.css link in head. -->
  <script src="script.js"></script>
